# This fixture is the green case for the exception mechanism: a service that
# genuinely needs another postgres major, and says so with a reason, an owner
# and a horizon. The rule matches on the exact path and the exact reference.
#
# `until` is QUOTED because YAML's core schema resolves an unquoted 2026-12-31 to
# a date rather than a string. The first version of this file left it bare, and
# test_the_harness_yaml_reader_reads_every_document_in_this_repository — which
# demands the harness and PyYAML agree on every YAML file core owns — caught the
# two readers disagreeing on the field's TYPE. The rule requires a string and
# would have reported the bare form correctly; quoting it is what makes this
# file, docs/postgres-pin.md and PyYAML agree.
exceptions:
  - file: docker-compose.yml
    image: postgres:16-alpine
    reason: >
      One legacy reporting replica runs postgres 16 and is retired with the
      2026-Q4 data-store migration. It is the only database container here.
    owner: platform
    until: "2026-12-31"
