# tenancy.yml — a service whose scoping this checker cannot read.
#
# It is a real shape, not a contrived one: the account is resolved by
# middleware, handed to a repository method as a parameter, and the repository
# method is where the boundary actually lives. That is `operation: call`, and
# the scanner reads SQL.
#
# So the honest verdict on this repository is NOT "no account-scoped routes" —
# it is `tenancy.enumeration-partial`, a warning that names this entry point,
# exits zero, and says the declaration is not proven closed. A checker that
# reported a confident zero here would be the exact defect this file exists to
# keep out of the fleet: the grep that says darkroom has no routes.
version: 1
service: tenant-unreadable-fixture

accountScoped: true

scope:
  key: account_id
  sources:
    - internal

entryPoints:
  # The route handler. Scoping is enforced by the store method it calls and by
  # the middleware that resolves the account, so the declaration points at the
  # line where the account enters the repository rather than at a statement.
  - id: get-asset
    operation: call
    subject: find_asset
    enforced:
      mechanism: middleware
      file: internal/http/assets.go
      line: 30
    negative:
      asserts: absent
      expects: not_found
      file: internal/http/assets_test.go
      line: 11
