# The normative burn-rate window catalog, as the file Sloth is pointed at.
#
#   sloth generate -i slos/ --slo-period 28d \
#     --slo-period-windows-path examples/valid/telemetry/slo-windows.yaml
#
# It is pinned ONCE, here, for the whole fleet, and no service carries its own
# copy. Sloth accepts --slo-period-windows-path precisely so a project can, and a
# project that does has burn alerts that mean something other than the SRE
# workbook's. The schema for this document is
# schemas/telemetry/slo-windows.schema.json, which pins the order as well as the
# values: the generator consumes these in short/long pairs, so a reordered list
# still validates as a set and quietly produces four alerts with the wrong
# pairing.
#
# 14.4 is 2% of a 28-day budget measured in hours: 0.02 x 720 = 14.4. It is not
# 15, and the rounding is the point — a 15x threshold fires before 2% of the
# budget is gone, so the alert would be late about being late.
version: prometheus/v1
windows:
  - window: 5m
    factor: 14.4
  - window: 1h
    factor: 14.4
  - window: 30m
    factor: 6
  - window: 6h
    factor: 6
  - window: 2h
    factor: 3
  - window: 1d
    factor: 3
  - window: 6h
    factor: 1
  - window: 3d
    factor: 1