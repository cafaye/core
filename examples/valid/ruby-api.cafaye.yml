# cafaye.yml — billing: a Ruby service with an HTTP API that consumes identity's events.
name: billing
description: Plans, subscriptions, prepaid credit, usage metering, webhooks in.
language: ruby
core: ^0.1.0

exposes:
  api: openapi/openapi.yaml
  events:
    - customer.created
    - subscription.started
    - subscription.updated
    - subscription.canceled
    - subscription.past_due
    - payment.succeeded
    - payment.failed
    - payment.refunded
    - usage.recorded
    - invoice.created

consumes:
  - user.created
  - account.created
  - member.joined

dependencies:
  - name: identity
    version: ^0.1.0
    required: true

repository:
  url: git@github.com:cafaye/billing.git
  defaultBranch: master
  visibility: public

owner:
  team: billing
  contact: billing@cafaye.com
